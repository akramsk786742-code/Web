<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Official Business Website</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 18s linear infinite; }
  </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col justify-between">

  <!-- Top Demo Banner -->
  <div class="bg-amber-400 text-black text-center py-2 px-4 text-xs md:text-sm font-bold shadow-md z-50">
    ⚡ LIVE DEMO PREVIEW — Yeh sample website aapke business ke hisaab se design ki gayi hai. Pasand aane par yeh top banner hata diya jayega!
  </div>

  <!-- Main Dynamic Container (Changes 100% by Business Type) -->
  <main id="app-root" class="flex-grow"></main>

  <!-- Common Footer -->
  <footer id="app-footer" class="py-6 text-center text-xs opacity-75 border-t border-current/10 mt-12">
    Website Designed & Powered by <span class="font-bold underline">SmartFix & Cyber Point</span>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = (params.get('type') || 'gym').toLowerCase();
    const name = params.get('name') || 'Royal Business Hub';
    const addr = params.get('addr') || 'GT Road, Main Market, Asansol';
    const phone = params.get('phone') || '917001423057';
    const time = params.get('time') || 'Mon - Sat: 9:00 AM – 9:00 PM';
    const rating = params.get('rating') || '4.9★ Rated';

    const cleanPhone = phone.replace(/[^0-9]/g, '');
    const waLink = (msg) => `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
    document.getElementById('page-title').innerText = `${name} | Official Website`;

    const root = document.getElementById('app-root');
    const body = document.getElementById('app-body');

    // ==========================================
    // 1. GYM LAYOUT (Bold + BMI Calculator + Plans)
    // ==========================================
    if (type === 'gym') {
      body.className = "bg-zinc-950 text-white min-h-screen flex flex-col justify-between";
      root.innerHTML = `
        <header class="bg-gradient-to-b from-red-900/60 to-zinc-950 py-16 px-6 text-center border-b border-zinc-800">
          <span class="bg-red-600 text-white text-xs font-bold uppercase px-3 py-1 rounded-full">🔥 ${rating} Fitness Center</span>
          <h1 class="text-4xl md:text-6xl font-extrabold mt-4 tracking-tight uppercase">${name}</h1>
          <p class="mt-3 max-w-xl mx-auto text-zinc-300">Heavy-duty imported machines, certified personal trainers, and result-driven transformation programs.</p>
          <div class="mt-7 flex flex-wrap justify-center gap-4">
            <a href="${waLink('Hi ' + name + ', I want to join the gym. Please share details!')}" target="_blank" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-7 rounded-xl shadow-lg">💪 Join via WhatsApp</a>
          </div>
          <div class="mt-8 max-w-3xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-3 text-xs bg-zinc-900/90 p-4 rounded-2xl border border-zinc-800">
            <div>📍 <span class="text-zinc-300">${addr}</span></div>
            <div>⏰ <span class="text-zinc-300">${time}</span></div>
            <div>📞 <span class="text-zinc-300">+${phone}</span></div>
          </div>
        </header>

        <!-- Interactive BMI Calculator (Unique to Gym) -->
        <section class="max-w-4xl mx-auto my-10 px-6">
          <div class="bg-zinc-900 border border-red-900/50 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
              <h2 class="text-xl font-bold text-red-500">⚡ Free Instant BMI Fitness Check</h2>
              <p class="text-xs text-zinc-400 mt-1">Apna weight aur height daal kar apna Body Mass Index check karein:</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
              <input id="bmi-w" type="number" placeholder="Weight (kg)" class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm w-28 text-white">
              <input id="bmi-h" type="number" placeholder="Height (cm)" class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm w-28 text-white">
              <button onclick="calcBMI()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-bold">Check</button>
            </div>
            <div id="bmi-res" class="text-sm font-bold text-amber-400">Result: --</div>
          </div>
        </section>

        <!-- 3 Pricing Plans -->
        <section class="max-w-5xl mx-auto px-6 py-4">
          <h2 class="text-2xl font-bold text-center mb-8">🏋️‍♂️ Membership Packages</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl text-center">
              <h3 class="text-lg font-bold">1 Month Starter</h3>
              <p class="text-3xl font-extrabold text-red-500 my-3">₹1,000</p>
              <p class="text-xs text-zinc-400 mb-6">Full Gym + Cardio Access + General Floor Trainer</p>
              <a href="${waLink('Hi ' + name + ', I want the 1 Month Gym Plan.')}" target="_blank" class="block bg-zinc-800 hover:bg-zinc-700 py-2.5 rounded-xl text-sm font-bold">Select Plan</a>
            </div>
            <div class="bg-zinc-900 border-2 border-red-500 p-6 rounded-2xl text-center relative">
              <span class="bg-red-600 text-white text-[10px] font-bold px-3 py-1 rounded-full absolute -top-3 left-1/2 -translate-x-1/2">MOST POPULAR</span>
              <h3 class="text-lg font-bold">3 Months Pro</h3>
              <p class="text-3xl font-extrabold text-red-500 my-3">₹2,500</p>
              <p class="text-xs text-zinc-400 mb-6">Strength + Cardio + Custom Diet Chart + Workout Split</p>
              <a href="${waLink('Hi ' + name + ', I want the 3 Months Pro Plan.')}" target="_blank" class="block bg-red-600 hover:bg-red-700 py-2.5 rounded-xl text-sm font-bold">Select Plan</a>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl text-center">
              <h3 class="text-lg font-bold">1 Year Transformation</h3>
              <p class="text-3xl font-extrabold text-red-500 my-3">₹8,000</p>
              <p class="text-xs text-zinc-400 mb-6">Maximum Savings + Personal Assessment & Diet Support</p>
              <a href="${waLink('Hi ' + name + ', I want the 1 Year Gym Plan.')}" target="_blank" class="block bg-zinc-800 hover:bg-zinc-700 py-2.5 rounded-xl text-sm font-bold">Select Plan</a>
            </div>
          </div>
        </section>
      `;
      window.calcBMI = () => {
        const w = parseFloat(document.getElementById('bmi-w').value);
        const h = parseFloat(document.getElementById('bmi-h').value) / 100;
        if (w > 0 && h > 0) {
          const bmi = (w / (h * h)).toFixed(1);
          const status = bmi < 18.5 ? 'Underweight (Gain Bulk)' : bmi < 25 ? 'Fit & Normal' : 'Overweight (Fat Loss)';
          document.getElementById('bmi-res').innerText = `BMI: ${bmi} (${status})`;
        }
      };
    }

    // ==========================================
    // 2. SALON LAYOUT (Luxury Split Header + Service Rate Menu List)
    // ==========================================
    else if (type === 'salon') {
      body.className = "bg-stone-950 text-pink-50 min-h-screen flex flex-col justify-between";
      const services = [
        { item: "Stylish Haircut + Hair Wash + Blow Dry", price: "₹249" },
        { item: "Beard Styling / Clean Shave + De-Tan", price: "₹149" },
        { item: "L'Oréal Deep Nourishing Hair Spa", price: "₹599" },
        { item: "O3+ / Gold Glow Facial + Face Cleanup", price: "₹799" },
        { item: "Keratin / Hair Smoothening Treatment", price: "₹1,999+" },
        { item: "HD Party & Bridal Makeup Package", price: "Book Trial" }
      ];
      root.innerHTML = `
        <header class="max-w-5xl mx-auto py-12 px-6 grid grid-cols-1 md:grid-cols-2 gap-8 items-center border-b border-pink-900/40">
          <div>
            <span class="bg-pink-600/20 text-pink-400 border border-pink-500/30 text-xs font-bold px-3 py-1 rounded-full">✨ Luxury Hair, Beauty & Bridal Studio</span>
            <h1 class="text-4xl md:text-5xl font-extrabold mt-4 text-white">${name}</h1>
            <p class="mt-3 text-sm text-pink-200/80">Experience top-class hair styling, skin rejuvenation, and bridal makeovers with 100% genuine international products.</p>
            <div class="mt-6 flex gap-3">
              <a href="${waLink('Hi ' + name + ', I want to book a salon appointment!')}" target="_blank" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-6 rounded-full text-sm">💇‍♀️ Book Appointment</a>
            </div>
          </div>
          <div class="bg-gradient-to-br from-pink-900/40 to-stone-900 border border-pink-800/40 p-6 rounded-3xl space-y-3 text-sm">
            <h3 class="text-pink-400 font-bold text-base">📍 Studio Information</h3>
            <p><strong>Address:</strong> ${addr}</p>
            <p><strong>Timings:</strong> ${time}</p>
            <p><strong>Booking Desk:</strong> +${phone}</p>
            <p class="text-xs text-pink-300 pt-2">✔ Fully AC Hygienic Studio &nbsp; ✔ Branded Kits Only</p>
          </div>
        </header>

        <!-- Parlour Service Price List (Menu Style instead of 3 boxes) -->
        <section class="max-w-4xl mx-auto py-10 px-6">
          <h2 class="text-2xl font-bold text-center text-pink-400 mb-2">✨ Service Rate Card & Menu</h2>
          <p class="text-center text-xs text-pink-200/60 mb-6">Click 'Book' next to any service to reserve your slot on WhatsApp</p>
          <div class="bg-stone-900/90 border border-pink-900/40 rounded-3xl divide-y divide-pink-950">
            ${services.map(s => `
              <div class="p-4 md:px-6 flex items-center justify-between gap-4">
                <div>
                  <h4 class="font-semibold text-sm md:text-base">${s.item}</h4>
                </div>
                <div class="flex items-center gap-4">
                  <span class="font-extrabold text-pink-400 text-sm md:text-base">${s.price}</span>
                  <a href="${waLink('Hi ' + name + ', I want to book: ' + s.item)}" target="_blank" class="bg-pink-600/20 hover:bg-pink-600 text-pink-300 hover:text-white border border-pink-500/40 px-3 py-1.5 rounded-full text-xs font-bold transition">Book Slot</a>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    // ==========================================
    // 3. CAFE / RESTAURANT LAYOUT (Swiggy/Zomato Style Digital Food Menu)
    // ==========================================
    else if (type === 'cafe') {
      body.className = "bg-amber-50 text-stone-900 min-h-screen flex flex-col justify-between";
      const menu = [
        { cat: "🔥 Bestseller Snacks", icon: "🍔", dish: "Special Cheese Burger / Paneer Roll", price: "₹89" },
        { cat: "🔥 Bestseller Snacks", icon: "🥟", dish: "Steamed / Crispy Fried Momos (8 Pcs)", price: "₹79" },
        { cat: "☕ Beverages & Shakes", icon: "🧋", dish: "Thick Cold Coffee with Ice Cream", price: "₹99" },
        { cat: "☕ Beverages & Shakes", icon: "☕", dish: "Special Masala Kulhad Chai / Hot Coffee", price: "₹30" },
        { cat: "🍕 Combos & Party", icon: "🍟", dish: "Friends Combo (2 Burgers + Fries + 2 Drinks)", price: "₹249" },
        { cat: "🎂 Celebration Cakes", icon: "🎂", dish: "Fresh Birthday & Anniversary Cakes (1 Pond)", price: "₹299+" }
      ];
      root.innerHTML = `
        <header class="bg-gradient-to-r from-orange-600 to-amber-600 text-white py-10 px-6 shadow-md">
          <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
              <span class="bg-black/25 text-white text-xs font-bold px-3 py-1 rounded-full">🍽️ 100% Fresh & Hygienic Food</span>
              <h1 class="text-3xl md:text-5xl font-extrabold mt-3">${name}</h1>
              <p class="text-sm text-orange-100 mt-1">📍 ${addr} &nbsp;|&nbsp; ⏰ ${time}</p>
            </div>
            <a href="${waLink('Hi ' + name + ', I want to place a food order / book a table!')}" target="_blank" class="bg-white text-orange-600 font-extrabold py-3 px-6 rounded-2xl shadow-lg text-sm whitespace-nowrap">
              🛵 Order on WhatsApp
            </a>
          </div>
        </header>

        <!-- Swiggy-Style Interactive Food Menu -->
        <section class="max-w-4xl mx-auto py-8 px-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-extrabold text-stone-800">📋 Digital Quick-Order Menu</h2>
            <span class="text-xs bg-green-100 text-green-800 font-bold px-3 py-1 rounded-full border border-green-300">● Live Kitchen Open</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${menu.map(m => `
              <div class="bg-white border border-amber-200 rounded-2xl p-4 shadow-sm flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="text-3xl bg-amber-100 w-14 h-14 rounded-xl flex items-center justify-center">${m.icon}</div>
                  <div>
                    <span class="text-[10px] font-bold uppercase text-orange-600">${m.cat}</span>
                    <h4 class="font-bold text-stone-800 text-sm md:text-base">${m.dish}</h4>
                    <p class="text-sm font-extrabold text-green-700 mt-0.5">${m.price}</p>
                  </div>
                </div>
                <a href="${waLink('Hi ' + name + ', I want to order: ' + m.dish + ' (' + m.price + ')')}" target="_blank" class="bg-orange-50 hover:bg-orange-600 text-orange-600 hover:text-white border border-orange-300 font-extrabold px-4 py-1.5 rounded-xl text-xs transition">
                  + ADD
                </a>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    // ==========================================
    // 4. CLINIC / DOCTOR LAYOUT (Medical White + Instant OPD Appointment Form)
    // ==========================================
    else if (type === 'clinic') {
      body.className = "bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between";
      root.innerHTML = `
        <header class="bg-white border-b border-slate-200 py-8 px-6">
          <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <span class="bg-sky-100 text-sky-800 text-xs font-bold px-3 py-1 rounded-full">🩺 Verified Healthcare & Diagnostics</span>
              <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mt-2">${name}</h1>
              <p class="text-sm text-slate-600 mt-1">📍 ${addr} &nbsp;|&nbsp; 📞 Emergency/Reception: +${phone}</p>
            </div>
            <div class="text-right">
              <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-lg">⏰ OPD Hours: ${time}</span>
            </div>
          </div>
        </header>

        <!-- 2-Column Doctor Info + Instant OPD Token Form -->
        <section class="max-w-5xl mx-auto py-10 px-6 grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h2 class="text-lg font-bold text-sky-700 mb-3">🏥 Available Medical Services</h2>
              <ul class="space-y-2.5 text-sm text-slate-700">
                <li>✔ General OPD Consultation & Health Checkup</li>
                <li>✔ Blood Pressure, Sugar (Diabetes) & Fever Care</li>
                <li>✔ Prescription, Routine Lab Tests & First-Aid</li>
                <li>✔ Child, Family & Senior Citizen Healthcare</li>
              </ul>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <h2 class="text-lg font-bold text-sky-700 mb-3">🕒 Clinic Visiting Schedule</h2>
              <table class="w-full text-left text-sm">
                <tr class="border-b"><td class="py-2 font-semibold">Morning Shift</td><td class="py-2 text-slate-600">9:00 AM – 1:30 PM</td></tr>
                <tr class="border-b"><td class="py-2 font-semibold">Evening Shift</td><td class="py-2 text-slate-600">5:00 PM – 9:00 PM</td></tr>
                <tr><td class="py-2 font-semibold">Sunday / Emergency</td><td class="py-2 text-emerald-600 font-semibold">Prior Appointment</td></tr>
              </table>
            </div>
          </div>

          <!-- Patient WhatsApp Token Booking Form -->
          <div class="bg-white p-6 md:p-8 rounded-2xl border-2 border-sky-500 shadow-md">
            <h2 class="text-xl font-extrabold text-slate-900">📅 Book OPD Appointment Token</h2>
            <p class="text-xs text-slate-500 mt-1 mb-5">Lambi line se bachein — apna naam bhar kar WhatsApp par direct appointment confirm karein:</p>
            <div class="space-y-4 text-sm">
              <div>
                <label class="block font-semibold mb-1">Patient Name *</label>
                <input id="pt-name" type="text" placeholder="Enter patient full name" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold mb-1">Age *</label>
                  <input id="pt-age" type="number" placeholder="e.g. 28" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5">
                </div>
                <div>
                  <label class="block font-semibold mb-1">Preferred Shift</label>
                  <select id="pt-shift" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white">
                    <option>Morning Shift</option>
                    <option>Evening Shift</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block font-semibold mb-1">Problem / Symptoms (Optional)</label>
                <input id="pt-prob" type="text" placeholder="e.g. Fever, Dental checkup, General OPD" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5">
              </div>
              <button onclick="bookOPD()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow transition">
                📲 Confirm Token on WhatsApp
              </button>
            </div>
          </div>
        </section>
      `;
      window.bookOPD = () => {
        const pName = document.getElementById('pt-name').value || 'Patient';
        const pAge = document.getElementById('pt-age').value || '--';
        const pShift = document.getElementById('pt-shift').value;
        const pProb = document.getElementById('pt-prob').value || 'Consultation';
        const msg = `Hello ${name}, I want to book an OPD Appointment:\n• Patient Name: ${pName}\n• Age: ${pAge}\n• Shift: ${pShift}\n• Purpose: ${pProb}`;
        window.open(waLink(msg), '_blank');
      };
    }

    // ==========================================
    // 5. COACHING / INSTITUTE LAYOUT (Ticker + Batch Timing Table)
    // ==========================================
    else if (type === 'coaching') {
      body.className = "bg-slate-950 text-white min-h-screen flex flex-col justify-between";
      root.innerHTML = `
        <!-- Moving Admission Notice Ticker -->
        <div class="bg-blue-700 text-white text-xs py-2 overflow-hidden border-b border-blue-500">
          <div class="animate-marquee font-semibold">
            📢 ADMISSIONS OPEN FOR NEW SESSION! &nbsp;&nbsp;|&nbsp;&nbsp; 🎯 Free 3-Day Demo Classes Available &nbsp;&nbsp;|&nbsp;&nbsp; 📝 Printed Study Material & Weekly OMR Mock Tests &nbsp;&nbsp;|&nbsp;&nbsp; 📞 Call Now: +${phone}
          </div>
        </div>

        <header class="max-w-5xl mx-auto py-12 px-6 text-center">
          <span class="bg-yellow-400 text-black text-xs font-extrabold px-3 py-1 rounded-full uppercase">🏆 Top Result-Oriented Institute</span>
          <h1 class="text-4xl md:text-5xl font-extrabold mt-4 text-white">${name}</h1>
          <p class="text-slate-300 text-sm md:text-base max-w-2xl mx-auto mt-2">📍 ${addr} &nbsp;|&nbsp; ⏰ ${time}</p>
          <div class="mt-6 flex flex-wrap justify-center gap-4">
            <a href="${waLink('Hello ' + name + ', I want to enquire about Admission & Free Demo Class!')}" target="_blank" class="bg-yellow-400 hover:bg-yellow-500 text-black font-extrabold py-3 px-7 rounded-xl text-sm shadow-lg">
              🎓 Book Free Demo Class
            </a>
          </div>
        </header>

        <!-- Batch Timings & Courses Table (Unique to Coaching) -->
        <section class="max-w-4xl mx-auto py-6 px-6">
          <h2 class="text-xl font-bold text-yellow-400 mb-4">📚 Active Courses & Batch Schedule</h2>
          <div class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-800 text-slate-300 text-xs uppercase">
                <tr>
                  <th class="p-4">Course / Class Batch</th>
                  <th class="p-4">Key Features</th>
                  <th class="p-4">Batch Status</th>
                  <th class="p-4">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                <tr>
                  <td class="p-4 font-bold">Foundation / Academic Batch</td>
                  <td class="p-4 text-slate-400 text-xs">Full Syllabus + Printed Notes + Doubt Class</td>
                  <td class="p-4"><span class="bg-green-900/50 text-green-400 text-xs px-2.5 py-1 rounded-full">Admission Open</span></td>
                  <td class="p-4"><a href="${waLink('Hi ' + name + ', fees details for Foundation Batch?')}" target="_blank" class="text-yellow-400 font-bold text-xs underline">Ask Fee →</a></td>
                </tr>
                <tr>
                  <td class="p-4 font-bold">Board / Target Exam Special</td>
                  <td class="p-4 text-slate-400 text-xs">Weekly Test Series + Previous 10 Yr Papers</td>
                  <td class="p-4"><span class="bg-amber-900/50 text-amber-300 text-xs px-2.5 py-1 rounded-full">Limited Seats</span></td>
                  <td class="p-4"><a href="${waLink('Hi ' + name + ', fees details for Target Batch?')}" target="_blank" class="text-yellow-400 font-bold text-xs underline">Ask Fee →</a></td>
                </tr>
                <tr>
                  <td class="p-4 font-bold">Special Skill / Computer Course</td>
                  <td class="p-4 text-slate-400 text-xs">100% Practical Training + ISO Certificate</td>
                  <td class="p-4"><span class="bg-green-900/50 text-green-400 text-xs px-2.5 py-1 rounded-full">New Batch</span></td>
                  <td class="p-4"><a href="${waLink('Hi ' + name + ', fees details for Practical Course?')}" target="_blank" class="text-yellow-400 font-bold text-xs underline">Ask Fee →</a></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // ==========================================
    // 6. LOCAL SHOP / MOBILE & REPAIR HUB LAYOUT (Catalog Grid + Quick Quote Box)
    // ==========================================
    else {
      body.className = "bg-slate-950 text-white min-h-screen flex flex-col justify-between";
      const items = [
        { icon: "📱", name: "Smartphone Display & Touch Replacement", tag: "1 Hour Service" },
